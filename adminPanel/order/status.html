<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        /* Layout */
        #main {
            display: flex;
        }

        /* Sidebar */
        #sidebar {
            width: 220px;
            height: 100vh;
            background: #222d32;
            color: white;
        }

        #sidebar h2 {
            padding: 15px;
            background: #1a2226;
        }

        #sidebar ul {
            list-style: none;
        }

        #sidebar ul li {
            padding: 12px 15px;
            border-bottom: 1px solid #2c3b41;
            cursor: pointer;
        }

        #sidebar ul li:hover {
            background: #1e282c;
        }

        /* Links */
        #sidebar a {
            text-decoration: none;
            color: white;
        }

        /* Content */
        section {
            flex: 1;
            padding: 20px;
        }

        .statusProduct {
            display: flex;
            justify-content: flex-start;
            display: flex;
            width: 100%;
            /* gap: 6vw; */
        }

        .statusp,
        .statusp1 {
            border: 1px solid #ccc;
            padding: 0.50vw;
            background: #f9f9f9;
            font-weight: bold;
            width: 9vw;
            display: flex;
            justify-content: center;
            font-size: clamp(10px, 0.4vw, 13px);
            flex: 1;
            width: auto;
            min-width: 80px;
        }

        .statusp1 {
            display: flex;
            font-size: 0.8vw;
            font-weight: normal;
            padding: 00.08vw;
            justify-content: center;
            align-items: center;
        }

        .maindivOrder {
            box-shadow: 0px 0px 3px 0px black;
            /* display: flex; */

        }

        #updatebtn {
            background: #0b5ed7;
            color: white;
        }

        #updatebtn:hover {
            /* background-color: #0d6efd; */
            background: #0b5ed7;
            cursor: pointer;
            border: 1px solid black;
            border-radius: 10px;
            transition: 0.3s;
        }

        #showOrderData {
            width: 100%;
            table-layout: fixed;
        }


        select option[value="Order Confirmed"] {
            color: green;
        }


        select option[value="In Transit"] {
            color: orange;
        }

        select option[value="Delivered"] {
            color: blue;
        }


        select option[value="Cancelled"] {
            color: red;
        }

        #searchDiv {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px;
        }

        .form-control {
            font-weight: bold;
            height: 30px;
            border: 1px solid #ccc;
            padding: 5px;
            /* border-radius: 5px; */
        }

        .btn-primary {
            background-color: green;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        .dateDiv {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div id="main">
        <!-- Sidebar -->
        <div id="sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <a href="../Dashboard.html">
                    <li>Dashboard</li>
                </a>
                <a href="./Order.html">
                    <li>Product</li>
                </a>
                <a href="status.html">
                    <li>Status</li>
                </a>
            </ul>
        </div>

        <!-- Content -->
        <section>
            <div class="maindivOrder" id="showOrderData">
                <div id="searchDiv">
                    <div class="dateDiv">
                        <p>Form</p>
                        <input class="form-control" id="formDate" type="date">
                    </div>
                    <div class="dateDiv">
                        <p>To</p>
                        <input class="form-control" id="toDate" type="date">
                    </div>
                    <div>
                        <button class="btn-primary" id="searchBtn">Search</button>
                    </div>
                </div>
                <div class="statusProduct">
                    <p class="statusp">Name</p>
                    <p class="statusp">Product Name</p>
                    <p class="statusp">Units</p>
                    <p class="statusp">Rate</p>
                    <p class="statusp">SubTotal</p>
                    <p class="statusp">GST %</p>
                    <p class="statusp">GST Amount</p>
                    <p class="statusp">Total Amount</p>
                    <p class="statusp">Status</p>
                    <p class="statusp">Address</p>
                    <p class="statusp">Mobile Number</p>
                    <p class="statusp">Order Date</p>
                    <p class="statusp">Button</p>
                </div>
            </div>
    </div>
    </section>
    </div>
    <script src="./config.js"></script>
    <script>
        document.querySelector("#searchBtn").addEventListener("click" , async ()=>{
            alert("btn click")
        })
        async function viewOrderDate() {
            const viewOrderDate = await fetch(`${BASE_URL}/viwePlaceOrder`)
            const resViewOrderdate = await viewOrderDate.json()
            console.log(resViewOrderdate);
            showdata(resViewOrderdate)
        }
        viewOrderDate()
        function showdata(data) {
            let statusProduct = document.querySelector("#showOrderData");
            data.forEach((item) => {
                statusProduct.innerHTML += `
                    <div class="statusProduct">
                    <p class="statusp1">${item.customerName}</p>
                            <p class="statusp1">${item.productName}</p>
                            <p class="statusp1">${item.qty}</p>
                            <p class="statusp1">₹${item.rate}</p>
                            <p class="statusp1">₹${item.totalAmount}</p>
                            <p class="statusp1">${item.gst}%</p>
                            <p class="statusp1">₹${item.gstAmount}</p>
                            <p class="statusp1">₹${item.withGstTotalAmount}</p>
                            
                
        
            <select class="statusp1">
        
            <option value="Order Confirmed"
            ${item.orderStatus === "Order Confirmed" ? "selected" : ""}>
            Order Confirmed
            </option>
        
            <option value="Order Packed"
            ${item.orderStatus === "Order Packed" ? "selected" : ""}>
            Order Packed
            </option>
        
            <option value="Shipped"
            ${item.orderStatus === "Shipped" ? "selected" : ""}>
            Shipped
            </option>
        
            <option value="In Transit"
            ${item.orderStatus === "In Transit" ? "selected" : ""}>
            In Transit
            </option>
        
            <option value="Out For Delivery"
            ${item.orderStatus === "Out For Delivery" ? "selected" : ""}>
            Out For Delivery
            </option>
        
            <option value="Delivered"
            ${item.orderStatus === "Delivered" ? "selected" : ""}>
            Delivered
            </option>
        
            <option value="Cancelled"
            ${item.orderStatus === "Cancelled" ? "selected" : ""}>
            Cancelled
            </option>
        
            <option value="Return Requested"
            ${item.orderStatus === "Return Requested" ? "selected" : ""}>
            Return Requested
            </option>
        
            <option value="Return Completed"
            ${item.orderStatus === "Return Completed" ? "selected" : ""}>
            Return Completed
            </option>
                </select>
                            <p class="statusp1">${item.customerAdd}</p>
                            <p class="statusp1">${item.customerMobileNumber}</p>
                            <p class="statusp1">${new Date(item.orderDate).toLocaleString("en-IN", {
                    timeZone: "Asia/Kolkata"
                })}
    </p>
                            <button  class="statusp1" data-id="${item._id}" id="updatebtn">Update</button>
                    </div>
                    `
                //update satuse
                document.querySelectorAll("#updatebtn").forEach((btn) => {
                    btn.addEventListener("click", async () => {
                        let orderDataId = btn.dataset.id;
                        let status = btn.closest(".statusProduct").querySelector("select").value;
                        console.log(orderDataId);
                        console.log(status);
                        let response = await fetch(`${BASE_URL}/updateOrderStatus/${orderDataId}`, {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({

                                status: status

                            })
                        })
                        let data = await response.json()
                        console.log(data);
                        alert("Order Status Updated");

                    })

                })
            })
        }
        document.querySelector("#searchBtn").addEventListener("click", async () => {
            let btn = document.querySelector("#searchBtn")
            console.log(btn);

            let formDate = document.querySelector("#formDate").value;
            let toDate = document.querySelector("#toDate").value;
            console.log("formDate", formDate, "ToDate", toDate);
            console.log(document.querySelector("#formDate").value)
        })

    </script>
</body>


</html>
