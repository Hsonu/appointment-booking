<script src="./config.js"></script>
<script>

    async function getData() {
        let res = await fetch(`${BASE_URL}/addProduct`)
        let data = await res.json();
        console.log(data);
        showDate(data)
    }
    getData()
    function showDate(data) {
        let mainDivCard = document.getElementById("mainDivCard");
        data.forEach((item) => {
            let gstAmount = (item.Rate * item.gst) / 100;
            let finalPrice = Math.round(item.Rate + gstAmount);
            mainDivCard.innerHTML += `
                 <div id="CardDiv">
                <div id="imgdiv">
                    <img id="ProductImage"
                            src="${item.photo}">
                
                </div>
                <div id="titleName">
                    <p id="titleP">${item.Productname}</p>
                </div>
                <div class="PriceAndBuyBtn">
                    <div class="AmountDiv">
                    <p id="PriceP">₹${finalPrice}</p>
                    <small id="smallgstText">✓ GST Included</small>
                    </div>
                    
                       <p class="BuyBtn" data-id="${item._id}">BUY NOW</p>  
                </div>
                    
                </div>
            </div>`
        })
        let BuyBtn = document.querySelectorAll(".BuyBtn");
        BuyBtn.forEach((btn) => {
            btn.addEventListener("click", (event) => {
                let id = event.target.dataset.id
                console.log(id);
                console.log("btnClick");
                window.location.href = `buyProduct.html?id=${id}`;
            })
        })
    }

</script>
