<script>
    async function allOrder() {
        let res = await fetch("http://localhost:8080/viwePlaceOrder");
        let resOrder = await res.json();
        // console.log(resOrder);
        allorderView(resOrder);
    }
    allOrder()
    async function allorderView(resOrder) {
        let showDataDiv = document.querySelector(".TwoDivMarger");

        resOrder.forEach((item) => {
            showDataDiv.innerHTML += `
        
            <div class="DetailsIMGmainDiv" data-id="${item._id}">
                        <div>
                            <img class="DetailsImgShow"
                                src="${item.photo}">
                        </div>
                        <div class="DetailsProducatName">
                            <p class="ProductNamesummary">${item.productName}</p>
                            <p class="productSummaryrate">₹ ${item.rate}</p>
                        </div>
                    </div>
                    
            `

        })
        // console.log(item._id);
        showDataDiv.addEventListener("click", (event) => {
            let card = event.target.closest(".DetailsIMGmainDiv");
            let id = card.dataset.id;
            console.log(id);
            window.location.href = `orderDetails.html?id=${id}`

        })
    }

</script>
