<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Golden Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8854e" />
      <stop offset="30%" stop-color="#c9a96e" />
      <stop offset="50%" stop-color="#e8d4a8" />
      <stop offset="70%" stop-color="#c9a96e" />
      <stop offset="100%" stop-color="#8a6e3d" />
    </linearGradient>
    <!-- Subtle Background Radial Gradient -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a1a1f" />
      <stop offset="100%" stop-color="#0d0d0f" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#darkBg)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />
  
  <!-- Main Inner Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="10 6" />
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Geometric Diamond Emblem at the top -->
  <g transform="translate(256, 120) scale(0.65)" filter="url(#goldGlow)">
    <!-- Top flat table -->
    <polygon points="-40,-30 40,-30 20,-50 -20,-50" fill="url(#goldGrad)" />
    <!-- Upper crown facets -->
    <polygon points="-40,-30 -20,-50 -50,-50" fill="url(#goldGrad)" opacity="0.8" />
    <polygon points="40,-30 20,-50 50,-50" fill="url(#goldGrad)" opacity="0.8" />
    <polygon points="-40,-30 0,10 -20,-30" fill="url(#goldGrad)" opacity="0.9" />
    <polygon points="40,-30 0,10 20,-30" fill="url(#goldGrad)" opacity="0.9" />
    <polygon points="-20,-30 0,10 20,-30" fill="url(#goldGrad)" />
    <!-- Lower pavilion facets -->
    <polygon points="-50,-50 -20,-50 -40,-30" fill="url(#goldGrad)" opacity="0.75" />
    <polygon points="50,-50 20,-50 40,-30" fill="url(#goldGrad)" opacity="0.75" />
  </g>

  <!-- Elegant Serif Lettering: SJ -->
  <text x="256" y="325" 
        font-family="'Playfair Display', 'Didot', 'Georgia', serif" 
        font-size="135" 
        font-weight="700" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="2"
        filter="url(#goldGlow)">SJ</text>

  <!-- Luxury Subtext -->
  <text x="256" y="385" 
        font-family="'Inter', 'Helvetica', sans-serif" 
        font-size="18" 
        font-weight="600" 
        fill="#e8d4a8" 
        text-anchor="middle" 
        letter-spacing="12" 
        opacity="0.9">JEWELLERY</text>

  <!-- Tiny Accent Stars -->
  <path d="M 125,256 L 129,260 L 125,264 L 121,260 Z" fill="url(#goldGrad)" />
  <path d="M 387,256 L 391,260 L 387,264 L 383,260 Z" fill="url(#goldGrad)" />
</svg>
